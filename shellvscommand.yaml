- name: shell vs command
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: test the command module
    #command: cat /etc/passwd | grep testuer
      shell: cat /etc/passwd | grep testuser
      register: testuser_output

    - name: print the output of command module
      debug:
        msg: "{{ testuser_output }}"

    - name: get the files
      command: ls -la > /tmp/files.txt
      register: files_output

    - name: print the files output
      debug:
        msg: "{{ files_output }}"    
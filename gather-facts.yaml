- name: print facts
  hosts: local
  connection: local
  tasks:
    - name: print the facts
      debug:
        msg: "{{ ansible_facts }}" # ansible_facts is a reserved variable   

    - name: print the default IPV4 address
      debug:
        msg : "{{ ansible_default_ipv4.address }}" # ansible_default_ipv4 is a reserved variable    

    - name: print some info
      debug:
        msg: |   # | for multiple lines
           OS Family: {{ ansible_facts['os_family'] }} 
           private_ip: {{ ansible_facts['default_ipv4']['address'] }}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
- name: course info
  hosts: local
  connection: local
  vars:
    course: "DevSecOps"  # string
    trainer: Siva 
    duration_in_hours: 180 hrs # numbers
    is_live_session: true  # boolean
    topics:
      - Observability
      - CI/CD                                 
      - DevSecOps
      - Ansible
      - Docker
      - Kubernetes
      - Terraform
    more_details:
      months: 4
      trainer: Siva
      exact_duration_in_months: 4.5
  tasks:
    - name: print the info and  type
      debug:
        msg: |   # | for multiple lines
           Hi, I am learning {{ course }} from trainer {{ trainer }} , and the duration is {{ duration_in_hours }}
           The type of course is {{ course | type_debug }}                                                      